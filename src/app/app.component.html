<ion-app>

  <div
    *ngIf="showPrivacyNotice && !router.url.startsWith('/politica-privacidad')" class="cookie-overlay"
  >
    <div class="cookie-box">
      <p>
        El juego muestra anuncios de Google, que puede usar cookies o identificadores.
        Este aviso no modifica tus preferencias publicitarias.
      </p>
      <a routerLink="/politica-privacidad">Política de privacidad</a>

      <button type="button" (click)="dismissPrivacyNotice()" class="accept-btn">
        Cerrar aviso
      </button>
    </div>
  </div>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
