<ion-header class="level-header">
  <ion-toolbar>
    <ion-title>El Ahorcado</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="openUserSettings()" aria-label="Ajustes de usuario">
        <ion-icon slot="icon-only" name="person-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="level-content">
  <div class="level-navigation">
    <button type="button" class="body-back-button" (click)="volver()" aria-label="Volver a las temáticas"><ion-icon name="arrow-back-outline" aria-hidden="true"></ion-icon></button>
    <button type="button" class="body-back-button" (click)="irAlInicio()" aria-label="Ir al inicio"><ion-icon name="home-outline" aria-hidden="true"></ion-icon></button>
  </div>
  <main class="level-shell" [class.native-shell]="platform.is('hybrid')">
    <section class="level-intro" aria-labelledby="level-title">
      <div class="theme-badge"><span aria-hidden="true">{{ temaActual.icono }}</span> {{ temaActual.nombre }}</div>
      <h1 id="level-title">Elige tu <span>nivel</span></h1>
    </section>

    <section class="level-grid" aria-label="Niveles disponibles">
      <button type="button" class="level-card easy" (click)="iniciarJuego('facil')" aria-label="Jugar en nivel fácil">
        <span class="level-card-body"><strong>Fácil</strong><span>Palabras cortas y conocidas para empezar sin complicaciones.</span></span>
        <span class="level-card-bottom"><span>Empezar partida</span><span class="level-arrow"><ion-icon name="arrow-forward-outline"></ion-icon></span></span>
      </button>
      <button type="button" class="level-card normal" (click)="iniciarJuego('normal')" aria-label="Jugar en nivel normal">
        <span class="level-card-body"><strong>Normal</strong><span>Palabras habituales para entrar en ritmo y disfrutar cada acierto.</span></span>
        <span class="level-card-bottom"><span>Empezar partida</span><span class="level-arrow"><ion-icon name="arrow-forward-outline"></ion-icon></span></span>
      </button>

      <button type="button" class="level-card advanced" (click)="iniciarJuego('avanzado')" aria-label="Jugar en nivel avanzado">
        <span class="level-card-body"><strong>Avanzado</strong><span>Palabras menos comunes para poner a prueba tu vocabulario.</span></span>
        <span class="level-card-bottom"><span>Empezar partida</span><span class="level-arrow"><ion-icon name="arrow-forward-outline"></ion-icon></span></span>
      </button>
    </section>

    <div class="level-ad-slot" *ngIf="!platform.is('hybrid')" aria-label="Publicidad">
      <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-6536506161156686" data-ad-slot="REEMPLAZAR_CON_SLOT_ADSENSE" data-ad-format="auto" data-full-width-responsive="true"></ins>
    </div>

    <app-footer></app-footer>
  </main>
</ion-content>
