<ion-header class="start-header">
  <ion-toolbar>
    <ion-title>
      <span>El Ahorcado</span>
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="openUserSettings()" aria-label="Ajustes de usuario">
        <ion-icon slot="icon-only" name="person-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="start-content">
  <div class="daily-modal-backdrop" *ngIf="showDailyModal" role="presentation" (click)="closeDailyModal()">
    <section class="daily-modal" role="dialog" aria-modal="true" aria-labelledby="daily-modal-title" (click)="$event.stopPropagation()">
      <button type="button" class="daily-modal-close" (click)="closeDailyModal()" aria-label="Cerrar reto diario"><ion-icon name="close-outline"></ion-icon></button>
      <span class="daily-modal-icon"><ion-icon name="calendar-outline"></ion-icon></span>
      <span class="section-kicker">RETO DE HOY</span>
      <h2 id="daily-modal-title">Una palabra. Un intento diario.</h2>
      <p>Todo el mundo juega con la misma palabra. ¿Serás capaz de descubrirla?</p>
      <button *ngIf="retoDiarioDisponible" type="button" class="daily-modal-action" (click)="iniciarRetoDiario()">Jugar ahora <ion-icon name="arrow-forward-outline"></ion-icon></button>
      <p *ngIf="!retoDiarioDisponible" class="daily-modal-complete" [class.won]="dailyResult === 'won'" [class.failed]="dailyResult === 'lost'">
        <ion-icon [name]="dailyResult === 'won' ? 'checkmark-circle-outline' : dailyResult === 'lost' ? 'close-circle-outline' : 'time-outline'" aria-hidden="true"></ion-icon>
        {{ dailyResult === 'won' ? '¡Reto superado!' : dailyResult === 'lost' ? 'Has fallado el reto.' : 'Reto finalizado.' }} Vuelve en {{ dailyCountdown }}.
      </p>
    </section>
  </div>
  <main class="start-shell" [class.native-shell]="platform.is('hybrid')">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-content">
        <div class="hangman-art" aria-hidden="true"><div class="hangman-rope"></div><div class="hangman-head"></div><div class="hangman-body"></div><div class="hangman-arm hangman-arm-left"></div><div class="hangman-arm hangman-arm-right"></div><div class="hangman-leg hangman-leg-left"></div><div class="hangman-leg hangman-leg-right"></div></div>
        <button type="button" class="hero-action" (click)="openThemeSelector()">Elegir temática <ion-icon name="arrow-forward-outline" aria-hidden="true"></ion-icon></button>
      </div>
    </section>

    <div class="daily-divider"><span>O TAMBIÉN</span></div>
    <button type="button" class="daily-challenge" [class.available]="retoDiarioDisponible" [class.completed]="!retoDiarioDisponible" (click)="openDailyModal()">
      <span class="daily-icon"><ion-icon name="calendar-outline" aria-hidden="true"></ion-icon></span>
      <span class="daily-copy"><span class="section-kicker">{{ retoDiarioDisponible ? 'RETO DE HOY' : dailyResult === 'lost' ? 'RETO FALLADO' : dailyResult === 'won' ? 'RETO SUPERADO' : 'RETO FINALIZADO' }}</span><strong>{{ retoDiarioDisponible ? '¿Puedes descubrir la palabra del día?' : 'Vuelve en ' + dailyCountdown }}</strong><small>{{ retoDiarioDisponible ? 'Una palabra compartida con todos. Cambia cada día.' : 'El próximo reto estará disponible mañana.' }}</small></span>
      <ion-icon class="daily-arrow" name="arrow-forward-outline" aria-hidden="true"></ion-icon>
    </button>
    <div class="web-ad-slot" *ngIf="!platform.is('hybrid')" aria-label="Publicidad">
      <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-6536506161156686" data-ad-slot="REEMPLAZAR_CON_SLOT_ADSENSE" data-ad-format="auto" data-full-width-responsive="true"></ins>
    </div>
    <app-footer></app-footer>
  </main>
</ion-content>
