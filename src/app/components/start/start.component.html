<ion-content class="start-content">
  <div class="start-brand-row">
    <h1 class="start-brand">Ahorcado</h1>
    <button type="button" class="start-profile" (click)="openUserSettings()" aria-label="Ver estadísticas y ajustes"><ion-icon name="person-outline" aria-hidden="true"></ion-icon></button>
  </div>
  <main class="start-shell" [class.native-shell]="platform.is('hybrid')">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-content">
        <img class="hangman-art" src="assets/home-hangman.svg" alt="" aria-hidden="true">
        <button type="button" class="hero-action" (click)="openThemeSelector()">Elegir temática <ion-icon name="arrow-forward-outline" aria-hidden="true"></ion-icon></button>
      </div>
    </section>

    <div class="daily-divider"><span>O TAMBIÉN</span></div>
    <button type="button" class="daily-challenge" [class.available]="timeTrialAvailable" [class.completed]="!timeTrialAvailable" (click)="startTimeTrial()" [disabled]="!timeTrialAvailable">
      <span class="daily-icon"><ion-icon name="timer-outline" aria-hidden="true"></ion-icon></span>
      <span class="daily-copy"><span class="section-kicker">MODO CONTRARRELOJ</span><strong>{{ timeTrialAvailable ? (timeTrialNeedsAd ? 'Ver anuncio para conseguir 1 reintento' : 'Supera 5 niveles antes de que se agote el tiempo') : timeTrialResult === 'won' ? 'Contrarreloj superado hoy' : 'Intentos agotados por hoy' }}</strong></span>
      <ion-icon class="daily-arrow" name="arrow-forward-outline" aria-hidden="true"></ion-icon>
    </button>
    <div class="web-ad-slot" *ngIf="!platform.is('hybrid')" aria-label="Publicidad">
      <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-6536506161156686" data-ad-slot="REEMPLAZAR_CON_SLOT_ADSENSE" data-ad-format="auto" data-full-width-responsive="true"></ins>
    </div>
    <app-footer></app-footer>
  </main>
</ion-content>
